services:
  postgres:
    image: postgres:16
    container_name: xshot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xshot_user
      POSTGRES_PASSWORD: xshot_password
      POSTGRES_DB: xshot_db
    ports:
      - "5432:5432"
    volumes:
      - xshot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xshot_user -d xshot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  xshot_pgdata:
